<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Интеграция через XML</title><desc id="desc">Ваша система передаёт платежи в SkySend, затем провайдерам. В обратном направлении предусмотрен обмен информацией о провайдерах и условиях. Схема не специфицирует поля протокола.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#111315}.h{font-size:30px;font-weight:600;letter-spacing:-.4px}.label{font-size:21px;font-weight:600}.small{font-size:15px;fill:#5F6368}.blue{fill:#0066B3}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066B3" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="32" y="52" class="h" text-anchor="start">Интеграция через XML</text><text x="32" y="84" class="small" text-anchor="start">Платежи и обмен информацией</text><rect x="32" y="153" width="256" height="112" rx="8" fill="#F4F5F6"/><text x="160" y="220" class="label" text-anchor="middle">Ваша система</text><rect x="432" y="153" width="256" height="112" rx="8" fill="#111315"/><text x="560" y="220" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" style="fill:white">SkySend</text><rect x="832" y="153" width="256" height="112" rx="8" fill="#F4F5F6"/><text x="960" y="220" class="label" text-anchor="middle">Провайдеры</text><path d="M288 190 H420" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="175" class="small" text-anchor="middle">Платежи</text><path d="M688 190 H820" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><text x="760" y="175" class="small" text-anchor="middle">Платежи</text><path d="M432 240 H300" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><path d="M832 240 H700" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="317" class="small" text-anchor="middle">Информация о провайдерах и условиях</text></svg>