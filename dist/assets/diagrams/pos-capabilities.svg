<svg xmlns="http://www.w3.org/2000/svg" width="890" height="406" viewBox="0 0 890 406" role="img" aria-labelledby="title desc"><title id="title">Штрих-Mobile Pay PRO: возможности</title><desc id="desc">Схема возможностей POS-терминала Штрих-Mobile Pay PRO. Аккумулятор и GPRS-модем. Устройство обозначено условной пиктограммой, это не изображение внешности модели.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#111315}.h{font-size:30px;font-weight:600;letter-spacing:-.4px}.label{font-size:21px;font-weight:600}.small{font-size:15px;fill:#5F6368}.blue{fill:#0066B3}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066B3" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="32" y="52" class="h" text-anchor="start">Штрих-Mobile Pay PRO</text><text x="32" y="86" class="small" text-anchor="start">Схема возможностей POS-терминала</text><rect x="32" y="116" width="292" height="250" rx="8" fill="#F4F5F6"/><g transform="translate(123 144)" fill="none" stroke="#111315" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect width="110" height="158" rx="9"/><rect x="15" y="16" width="80" height="43" rx="2"/><path d="M21 85h12m17 0h12m17 0h12M21 108h12m17 0h12m17 0h12M21 131h12m17 0h12m17 0h12"/></g><text x="178" y="346" class="small" text-anchor="middle">Условное обозначение</text><text x="372" y="174" class="label" text-anchor="start">Аккумулятор</text><text x="372" y="276" class="label" text-anchor="start">GPRS-модем</text><path d="M372 211 H854" stroke="#D8DADD"/></svg>