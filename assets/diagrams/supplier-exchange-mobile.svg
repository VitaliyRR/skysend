<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title desc"><title id="title">Интеграция поставщика со SkyMarket</title><desc id="desc">Система поставщика обменивается данными со SkyMarket: справочник товаров, заказы и доставка. SkyMarket передаёт справочник на терминалы SkySend и в FINGER. Вертикальная концептуальная схема для узкого экрана.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#111315}.h{font-size:30px;font-weight:600;letter-spacing:-.4px}.label{font-size:21px;font-weight:600}.small{font-size:15px;fill:#5F6368}.blue{fill:#0066B3}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066B3" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="20" y="38" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#111315">Интеграция поставщика</text><text x="20" y="70" class="small" text-anchor="start">Схема XML-обмена SkyMarket</text><rect x="20" y="102" width="320" height="84" rx="8" fill="#F4F5F6"/><text x="180" y="152" class="label" text-anchor="middle">Система поставщика</text><path d="M166 194 V235" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><path d="M194 237 V196" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="246" width="320" height="84" rx="8" fill="#111315"/><text x="180" y="297" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" style="fill:#FFFFFF">SkyMarket</text><path d="M180 330 V361 H95 V389" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 330 V361 H265 V389" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="404" width="150" height="72" rx="8" fill="#F4F5F6"/><text x="95" y="448" class="label" text-anchor="middle">Терминалы</text><rect x="190" y="404" width="150" height="72" rx="8" fill="#F4F5F6"/><text x="265" y="448" class="label" text-anchor="middle">FINGER</text><text x="20" y="523" class="label" text-anchor="start">Справочник товаров</text><text x="20" y="556" class="label" text-anchor="start">Заказы</text><text x="20" y="589" class="label" text-anchor="start">Доставка</text></svg>