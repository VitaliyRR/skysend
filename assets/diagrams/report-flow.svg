<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="295" viewBox="0 0 1120 295" role="img" aria-labelledby="title desc"><title id="title">Автоматизация отчётности</title><desc id="desc">Платежи за выбранный период, реестр и отчёт. Это схема возможностей личного кабинета по тексту исходного сайта; примеры сумм и фиктивные таблицы не используются.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#111315}.h{font-size:30px;font-weight:600;letter-spacing:-.4px}.label{font-size:21px;font-weight:600}.small{font-size:15px;fill:#5F6368}.blue{fill:#0066B3}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066B3" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="32" y="52" class="h" text-anchor="start">Автоматизация отчётности</text><text x="32" y="86" class="small" text-anchor="start">Платежи, реестры и отчёты в личном кабинете</text><rect x="32" y="123" width="324" height="124" rx="8" fill="#F4F5F6"/><text x="56" y="162" class="small" text-anchor="start">01</text><text x="56" y="209" class="label" text-anchor="start">Платежи за период</text><path d="M360 185 H385" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="398" y="123" width="324" height="124" rx="8" fill="#F4F5F6"/><text x="422" y="162" class="small" text-anchor="start">02</text><text x="422" y="209" class="label" text-anchor="start">Реестр</text><path d="M726 185 H751" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="764" y="123" width="324" height="124" rx="8" fill="#F4F5F6"/><text x="788" y="162" class="small" text-anchor="start">03</text><text x="788" y="209" class="label" text-anchor="start">Отчёт</text></svg>