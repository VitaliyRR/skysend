<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">Приём платежей через SkySend</title><desc id="desc">Терминал, кассир и смартфон передают платежи через систему SkySend провайдерам. Концептуальная схема каналов, не география сети.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#111315}.h{font-size:30px;font-weight:600;letter-spacing:-.4px}.label{font-size:21px;font-weight:600}.small{font-size:15px;fill:#5F6368}.blue{fill:#0066B3}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066B3" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="32" y="52" class="h" text-anchor="start">Приём платежей через SkySend</text><text x="32" y="84" class="small" text-anchor="start">Каналы приёма и направление платежа</text><rect x="32" y="138" width="240" height="78" rx="8" fill="#F4F5F6"/><text x="62" y="184" class="label" text-anchor="start">Терминал</text><path d="M272 177 H330 V291 H427" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="252" width="240" height="78" rx="8" fill="#F4F5F6"/><text x="62" y="298" class="label" text-anchor="start">Кассир</text><path d="M272 291 H330 V291 H427" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="366" width="240" height="78" rx="8" fill="#F4F5F6"/><text x="62" y="412" class="label" text-anchor="start">Смартфон</text><path d="M272 405 H330 V291 H427" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="442" y="234" width="234" height="114" rx="8" fill="#111315"/><text x="559" y="303" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="600" style="fill:white">SkySend</text><path d="M676 291 H820" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="836" y="234" width="252" height="114" rx="8" fill="#F4F5F6"/><text x="962" y="303" class="label" text-anchor="middle">Провайдеры</text></svg>