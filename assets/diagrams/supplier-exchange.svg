<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="416" viewBox="0 0 1120 416" role="img" aria-labelledby="title desc"><title id="title">Интеграция поставщика со SkyMarket</title><desc id="desc">Система поставщика обменивается данными со SkyMarket: справочник товаров, заказы и доставка. SkyMarket передаёт справочник на терминалы SkySend и в FINGER. Концептуальная схема, без технических полей XML.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#111315}.h{font-size:30px;font-weight:600;letter-spacing:-.4px}.label{font-size:21px;font-weight:600}.small{font-size:15px;fill:#5F6368}.blue{fill:#0066B3}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066B3" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="32" y="52" class="h" text-anchor="start">Интеграция поставщика</text><text x="32" y="86" class="small" text-anchor="start">Схема XML-обмена SkyMarket</text><rect x="32" y="177" width="276" height="114" rx="8" fill="#F4F5F6"/><text x="170" y="222" class="label" text-anchor="middle">Система</text><text x="170" y="251" class="label" text-anchor="middle">поставщика</text><rect x="436" y="177" width="244" height="114" rx="8" fill="#111315"/><text x="558" y="245" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" style="fill:#FFFFFF">SkyMarket</text><path d="M308 214 H424" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><path d="M436 254 H320" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="836" y="128" width="252" height="84" rx="8" fill="#F4F5F6"/><text x="962" y="178" class="label" text-anchor="middle">Терминалы</text><rect x="836" y="256" width="252" height="84" rx="8" fill="#F4F5F6"/><text x="962" y="306" class="label" text-anchor="middle">FINGER</text><path d="M680 234 H752 V170 H824" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 234 H752 V298 H824" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="372" class="label" text-anchor="start">Справочник товаров</text><text x="320" y="372" class="label" text-anchor="start">Заказы</text><text x="486" y="372" class="label" text-anchor="start">Доставка</text></svg>