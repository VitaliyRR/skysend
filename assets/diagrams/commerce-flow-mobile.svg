<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img" aria-labelledby="title desc"><title id="title">Заказ и оплата продукции</title><desc id="desc">Последовательность работы: загрузка справочника товаров, формирование заказов, оплата заказов.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#111315}.h{font-size:30px;font-weight:600;letter-spacing:-.4px}.label{font-size:21px;font-weight:600}.small{font-size:15px;fill:#5F6368}.blue{fill:#0066B3}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#0066B3" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><text x="20" y="40" class="h" text-anchor="start">Заказ и оплата</text><rect x="20" y="80" width="320" height="136" rx="8" fill="#F4F5F6"/><text x="40" y="114" class="small" text-anchor="start">01</text><text x="40" y="154" class="label" text-anchor="start">Загрузка справочника</text><text x="40" y="181" class="label" text-anchor="start">товаров</text><path d="M180 223 V240" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="250" width="320" height="136" rx="8" fill="#F4F5F6"/><text x="40" y="284" class="small" text-anchor="start">02</text><text x="40" y="324" class="label" text-anchor="start">Формирование</text><text x="40" y="351" class="label" text-anchor="start">заказов</text><path d="M180 393 V410" fill="none" stroke="#0066B3" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="420" width="320" height="136" rx="8" fill="#F4F5F6"/><text x="40" y="454" class="small" text-anchor="start">03</text><text x="40" y="494" class="label" text-anchor="start">Оплата заказов</text></svg>